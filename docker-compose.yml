version: '3.8'

services:

  # ── Backend — Node.js API ──────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teamnotes-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./backend/data:/app/data
    networks:
      - teamnotes-network
    restart: unless-stopped
    healthcheck: 
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ── Frontend — React + Nginx ───────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: teamnotes-frontend
    ports:
      - "3001:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - teamnotes-network
    restart: unless-stopped

# ── Network ────────────────────────────────────
networks:
  teamnotes-network:
    driver: bridge

      